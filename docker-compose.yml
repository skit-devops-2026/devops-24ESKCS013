version: '3.8'

services:
  # MySQL database service
  db:
    image: mysql:8.0
    container_name: campusconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: campusconnect
      MYSQL_USER: campususer
      MYSQL_PASSWORD: campus123
    ports:
      - "3307:3306"
    volumes:
      - campusconnect_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "campususer", "-pcampus123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js backend service
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusconnect_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: campususer
      DB_PASSWORD: campus123
      DB_NAME: campusconnect
      JWT_SECRET: campusconnect_super_secret_jwt_key_2024
      JWT_EXPIRES_IN: 7d
      EMAIL_HOST: smtp.ethereal.email
      EMAIL_PORT: 587
      EMAIL_USER: placeholder@ethereal.email
      EMAIL_PASS: placeholder
      PORT: 5000
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    command: node server.js

volumes:
  campusconnect_data:
