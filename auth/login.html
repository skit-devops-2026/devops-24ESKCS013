<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-layout">
  <main class="auth-panel auth-panel-wide" role="main">
    <div class="auth-header">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-desc">Choose your account type to continue.</p>
    </div>
    
    <div class="role-cards" role="region" aria-label="Select login role">
      <a href="student-login.html" class="role-card" tabindex="0" aria-label="Continue to Student Portal">
        <div class="role-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
          </svg>
        </div>
        <h2 class="role-title">Student Portal</h2>
        <p class="role-desc">Track study time, view your Growth Score, and access AI coaching.</p>
      </a>
      
      <a href="admin-login.html" class="role-card" tabindex="0" aria-label="Continue to Admin Portal">
        <div class="role-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <h2 class="role-title">Admin Portal</h2>
        <p class="role-desc">Manage students, review analytics, and configure AI features.</p>
      </a>
    </div>

    <div class="auth-footer mt-8">
      <a href="../index.html">&larr; Back to Home</a>
    </div>
  </main>
</body>
</html>
