<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-layout">
  <main class="auth-panel" role="main">
    <div class="auth-header">
      <h1 class="auth-title">Student Login</h1>
      <p class="auth-desc">Welcome back to your academic ledger.</p>
    </div>
    
    <form class="auth-form" id="student-login-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="student@example.com" required autocomplete="email">
        <div id="email-error" class="field-error-msg" aria-live="polite"></div>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" data-target="login-password" aria-label="Show password"></button>
        </div>
        <div id="password-error" class="field-error-msg" aria-live="polite"></div>
      </div>
      
      <div class="auth-options">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <span class="btn-spinner" aria-hidden="true"></span>
        <span class="btn-text">Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="student-register.html">Register here</a></p>
      <p class="mt-2"><a href="login.html" class="text-faint">&larr; Back to role selection</a></p>
    </div>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
