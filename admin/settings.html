<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Admin Portal</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app-layout">
    <!-- Admin Sidebar -->
    <aside class="sidebar admin-sidebar">
      <div class="sidebar-header">
        Admin Portal
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="students.html" class="sidebar-link">Students</a>
        <a href="analytics.html" class="sidebar-link">Analytics</a>
        <a href="resources.html" class="sidebar-link">Resources</a>
        <a href="announcements.html" class="sidebar-link">Announcements</a>
        <a href="ai-management.html" class="sidebar-link">AI Management</a>
        <a href="subjects.html" class="sidebar-link">Subjects</a>
      </nav>
      <div class="sidebar-footer">
        <a href="settings.html" class="sidebar-link active">Settings</a>
        <a href="../index.html" class="sidebar-link">Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">System Settings</h1>
          <p class="dashboard-subtitle">Global configuration for Student360.</p>
        </div>
      </header>

      <div class="dashboard-grid">
        <div class="dashboard-main">
          
          <div class="dashboard-panel">
            <h2 class="panel-title">General Information</h2>
            <form>
              <div class="form-group">
                <label class="form-label">Portal Name</label>
                <input type="text" class="form-control" value="Student360">
              </div>
              <div class="form-group">
                <label class="form-label">Academic Year</label>
                <input type="text" class="form-control" value="2026-2027">
              </div>
              <button type="button" class="btn btn-outline mt-2">Save General Settings</button>
            </form>
          </div>

          <div class="dashboard-panel">
            <h2 class="panel-title">Growth Score Weights</h2>
            <p class="text-faint" style="font-size: 0.875rem; margin-bottom: 1.5rem;">Adjust the formula used to calculate the Growth Score. Total must equal 100%.</p>
            
            <form id="growth-weights-form">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label">Study Consistency (%)</label>
                  <input type="number" class="form-control tabular-nums" value="20" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Goal Completion (%)</label>
                  <input type="number" class="form-control tabular-nums" value="20" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Topic Progress (%)</label>
                  <input type="number" class="form-control tabular-nums" value="20" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Practice (%)</label>
                  <input type="number" class="form-control tabular-nums" value="15" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Revision (%)</label>
                  <input type="number" class="form-control tabular-nums" value="10" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Task Completion (%)</label>
                  <input type="number" class="form-control tabular-nums" value="10" min="0" max="100">
                </div>
                <div class="form-group">
                  <label class="form-label">Self Reflection (%)</label>
                  <input type="number" class="form-control tabular-nums" value="5" min="0" max="100">
                </div>
                
                <div class="form-group" style="display: flex; flex-direction: column; justify-content: flex-end;">
                  <div style="padding: 0.5rem; background-color: var(--paper); border: 1px solid var(--rule); border-radius: 4px; text-align: center;">
                    <span class="text-faint" style="font-size: 0.75rem; display: block; margin-bottom: 0.25rem;">Total</span>
                    <span id="weight-total" class="tabular-nums text-green" style="font-weight: 600; font-size: 1.25rem;">100%</span>
                  </div>
                </div>
              </div>
              
              <button type="submit" class="btn btn-primary mt-4">Save Configuration</button>
            </form>
          </div>

        </div>
      </div>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
