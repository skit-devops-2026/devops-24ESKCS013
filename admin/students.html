<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Admin Portal</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app-layout">
    <!-- Admin Sidebar -->
    <aside class="sidebar admin-sidebar">
      <div class="sidebar-header">
        Admin Portal
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="students.html" class="sidebar-link active">Students</a>
        <a href="analytics.html" class="sidebar-link">Analytics</a>
        <a href="resources.html" class="sidebar-link">Resources</a>
        <a href="announcements.html" class="sidebar-link">Announcements</a>
        <a href="ai-management.html" class="sidebar-link">AI Management</a>
        <a href="subjects.html" class="sidebar-link">Subjects</a>
      </nav>
      <div class="sidebar-footer">
        <a href="settings.html" class="sidebar-link">Settings</a>
        <a href="../index.html" class="sidebar-link">Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Students</h1>
          <p class="dashboard-subtitle">Manage student accounts and view academic standing.</p>
        </div>
        <div>
          <button class="btn btn-primary">+ Invite Student</button>
        </div>
      </header>

      <div class="dashboard-panel" style="margin-bottom: 2rem; padding: 1rem;">
        <div style="display: flex; gap: 1rem;">
          <input type="text" id="student-search" class="form-control" placeholder="Search by name or email…" style="flex: 1;">
          <select id="student-course-filter" class="form-control" style="width: 200px;">
            <option>All Courses</option>
            <option>B.Sc. Computer Science</option>
            <option>B.Sc. Physics</option>
            <option>B.A. Literature</option>
          </select>
          <select id="student-status-filter" class="form-control" style="width: 150px;">
            <option>All Statuses</option>
            <option>Active</option>
            <option>At Risk</option>
            <option>Inactive</option>
            <option>Suspended</option>
          </select>
        </div>
      </div>

      <div class="dashboard-panel" style="padding: 0; overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Course</th>
              <th>Growth Score</th>
              <th>Status</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="students-table-body"></tbody>
        </table>
      </div>
      
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
