    <main class="main-content" role="main">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Manage Resources</h1>
          <p class="dashboard-subtitle">Upload and distribute materials to student cohorts.</p>
        </div>
      </header>

      <div class="dashboard-grid">
        <div class="dashboard-main">
          
          <div class="dashboard-panel" style="padding: 0; overflow-x: auto;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Type</th>
                  <th>Subject</th>
                  <th>Status</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="resources-table-body">

              </tbody>
            </table>
          </div>

        </div>

        <div class="dashboard-side">
          <div class="dashboard-panel">
            <h2 class="panel-title">Add Resource</h2>
            <form id="new-resource-form">
              <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" placeholder="Resource title…" required>
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select name="type" class="form-control">
                  <option>PDF Document</option>
                  <option>Video</option>
                  <option>External Link</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Subject</label>
                <select name="subject" class="form-control">
                  <option>Calculus II</option>
                  <option>Physics 101</option>
                  <option>Computer Science</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">URL / Resource Link</label>
                <input type="text" name="url" class="form-control" placeholder="https://…">
              </div>
              <div style="display:flex; flex-direction:column; gap:0.5rem; margin-top:1.5rem;">
                <button type="submit" data-status="Draft" class="btn btn-outline" style="width: 100%;">Save as Draft</button>
                <button type="submit" data-status="Published" class="btn btn-primary" style="width: 100%;">Publish Resource</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
