<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="text-gold">Student</span>360</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="study.html" class="sidebar-link">Study Tracker</a>
        <a href="subjects.html" class="sidebar-link">Subjects</a>
        <a href="notes.html" class="sidebar-link">Notes</a>
        <a href="tasks.html" class="sidebar-link active">Tasks</a>
        <a href="goals.html" class="sidebar-link">Goals</a>
        <a href="calendar.html" class="sidebar-link">Calendar</a>
        <a href="progress.html" class="sidebar-link">Progress</a>
        <a href="analytics.html" class="sidebar-link">Analytics</a>
        <a href="reflection.html" class="sidebar-link">Self Review</a>
        <a href="ai.html" class="sidebar-link">AI Assistant</a>
        <a href="resources.html" class="sidebar-link">Resources</a>
        <a href="announcements.html" class="sidebar-link">Announcements</a>
      </nav>
      <div class="sidebar-footer">
        <a href="profile.html" class="sidebar-link">Settings / Profile</a>
        <a href="../index.html" class="sidebar-link text-faint">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Tasks</h1>
          <p class="dashboard-subtitle">Manage your daily assignments and readings.</p>
        </div>
      </header>

      <!-- Filters -->
      <div class="dashboard-panel" style="margin-bottom: 2rem; padding: 1rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <input type="text" id="task-search" class="form-control" placeholder="Search tasks…" style="flex: 1; min-width: 180px;">
          <select id="filter-status" class="form-control" style="width: 150px;">
            <option>All Tasks</option>
            <option>Pending</option>
            <option>Completed</option>
            <option>Overdue</option>
          </select>
          <select id="filter-subject" class="form-control" style="width: 160px;">
            <option>All Subjects</option>
            <option>Calculus II</option>
            <option>Physics 101</option>
            <option>Computer Science</option>
          </select>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-main">
          <!-- Task list rendered by tasks.js -->
          <div id="task-list"></div>
        </div>

        <!-- Quick Add -->
        <div class="dashboard-side">
          <div class="dashboard-panel">
            <h2 class="panel-title">Quick Add Task</h2>
            <form id="new-task-form">
              <div class="form-group">
                <input type="text" name="title" class="form-control" placeholder="Task title…" required>
              </div>
              <div class="form-group">
                <select name="subject" class="form-control">
                  <option value="">Select Subject…</option>
                  <option>Calculus II</option>
                  <option>Physics 101</option>
                  <option>Computer Science</option>
                  <option>Literature</option>
                </select>
              </div>
              <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <input type="date" name="dueDate" class="form-control">
                <input type="time" name="dueTime" class="form-control">
              </div>
              <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <select name="priority" class="form-control">
                  <option>Medium</option>
                  <option>High</option>
                  <option>Low</option>
                </select>
                <input type="number" name="estMins" class="form-control tabular-nums" placeholder="Est. mins" min="1">
              </div>
              <button type="submit" class="btn btn-outline" style="width: 100%;">Save Task</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
