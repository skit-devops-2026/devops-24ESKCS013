<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your daily tasks and assignments with filters and priority tracking.">
  <title>Tasks — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <button class="sidebar-hamburger" aria-label="Open navigation menu" aria-expanded="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Student navigation">
      <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span><span class="text-gold sidebar-brand-text">Student</span><span class="sidebar-brand-text">360</span></span>
        <button class="sidebar-collapse-btn" aria-label="Collapse sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <a href="dashboard.html" class="sidebar-link"><span class="link-label">Dashboard</span></a>
        <a href="study.html"     class="sidebar-link"><span class="link-label">Study Tracker</span></a>
        <a href="subjects.html"  class="sidebar-link"><span class="link-label">Subjects</span></a>
        <a href="notes.html"     class="sidebar-link"><span class="link-label">Notes</span></a>
        <a href="tasks.html"     class="sidebar-link active"><span class="link-label">Tasks</span></a>
        <a href="goals.html"     class="sidebar-link"><span class="link-label">Goals</span></a>
        <a href="calendar.html"  class="sidebar-link"><span class="link-label">Calendar</span></a>
        <a href="progress.html"  class="sidebar-link"><span class="link-label">Progress</span></a>
        <a href="analytics.html" class="sidebar-link"><span class="link-label">Analytics</span></a>
        <a href="reflection.html" class="sidebar-link"><span class="link-label">Self Review</span></a>
        <a href="ai.html"        class="sidebar-link"><span class="link-label">AI Assistant</span></a>
        <a href="resources.html" class="sidebar-link"><span class="link-label">Resources</span></a>
        <a href="announcements.html" class="sidebar-link"><span class="link-label">Announcements</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="profile.html"  class="sidebar-link"><span class="link-label">Settings / Profile</span></a>
        <a href="../index.html" class="sidebar-link text-faint"><span class="link-label">Logout</span></a>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Tasks</h1>
          <p class="dashboard-subtitle">Manage your daily assignments and readings.</p>
        </div>
      </header>

      <!-- Filter tabs (replaces status select) -->
      <div class="filter-tabs" role="tablist" aria-label="Filter tasks by status">
        <button class="filter-tab active" data-filter="All Tasks"  role="tab" aria-selected="true">All Tasks</button>
        <button class="filter-tab"        data-filter="Pending"    role="tab" aria-selected="false">Pending</button>
        <button class="filter-tab"        data-filter="Completed"  role="tab" aria-selected="false">Completed</button>
        <button class="filter-tab"        data-filter="Overdue"    role="tab" aria-selected="false">Overdue</button>
      </div>

      <!-- Search + subject filter -->
      <div class="dashboard-panel" style="margin-bottom: 1.5rem; padding: 1rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <input type="text" id="task-search" class="form-control" placeholder="Search tasks…" style="flex: 1; min-width: 180px;" aria-label="Search tasks">
          <select id="filter-subject" class="form-control" style="width: 180px;" aria-label="Filter by subject">
            <option>All Subjects</option>
            <option>Calculus II</option>
            <option>Physics 101</option>
            <option>Computer Sci</option>
          </select>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="dashboard-main">
          <!-- Task list rendered by tasks.js -->
          <div id="task-list" aria-live="polite"></div>
        </div>

        <!-- Quick Add -->
        <div class="dashboard-side">
          <div class="dashboard-panel">
            <h2 class="panel-title">Quick Add Task</h2>
            <form id="new-task-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="new-task-title">Title</label>
                <input type="text" id="new-task-title" name="title" class="form-control" placeholder="Task title…" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="new-task-subject">Subject</label>
                <select id="new-task-subject" name="subject" class="form-control">
                  <option value="">Select Subject…</option>
                  <option>Calculus II</option>
                  <option>Physics 101</option>
                  <option>Computer Sci</option>
                  <option>Literature</option>
                </select>
              </div>
              <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <div>
                  <label class="form-label" for="new-task-date">Due Date</label>
                  <input type="date" id="new-task-date" name="dueDate" class="form-control">
                </div>
                <div>
                  <label class="form-label" for="new-task-time">Due Time</label>
                  <input type="time" id="new-task-time" name="dueTime" class="form-control">
                </div>
              </div>
              <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <div>
                  <label class="form-label" for="new-task-priority">Priority</label>
                  <select id="new-task-priority" name="priority" class="form-control">
                    <option>Medium</option>
                    <option>High</option>
                    <option>Low</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="new-task-mins">Est. Mins</label>
                  <input type="number" id="new-task-mins" name="estMins" class="form-control tabular-nums" placeholder="30" min="1">
                </div>
              </div>
              <button type="submit" class="btn btn-outline" style="width: 100%;">Save Task</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
