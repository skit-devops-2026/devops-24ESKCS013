<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><span class="text-gold">Student</span>360</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="study.html" class="sidebar-link">Study Tracker</a>
        <a href="subjects.html" class="sidebar-link">Subjects</a>
        <a href="notes.html" class="sidebar-link">Notes</a>
        <a href="tasks.html" class="sidebar-link">Tasks</a>
        <a href="goals.html" class="sidebar-link active">Goals</a>
        <a href="calendar.html" class="sidebar-link">Calendar</a>
        <a href="progress.html" class="sidebar-link">Progress</a>
        <a href="analytics.html" class="sidebar-link">Analytics</a>
        <a href="reflection.html" class="sidebar-link">Self Review</a>
        <a href="ai.html" class="sidebar-link">AI Assistant</a>
        <a href="resources.html" class="sidebar-link">Resources</a>
        <a href="announcements.html" class="sidebar-link">Announcements</a>
      </nav>
      <div class="sidebar-footer">
        <a href="profile.html" class="sidebar-link">Settings / Profile</a>
        <a href="../index.html" class="sidebar-link text-faint">Logout</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Goals</h1>
          <p class="dashboard-subtitle">Set targets and track your milestones.</p>
        </div>
      </header>

      <div class="dashboard-grid">
        <!-- Goals rendered by goals.js -->
        <div class="dashboard-main">
          <div id="goals-container"></div>
        </div>

        <!-- Create Goal -->
        <div class="dashboard-side">
          <div class="dashboard-panel">
            <h2 class="panel-title">Create Goal</h2>
            <form id="create-goal-form">
              <div class="form-group">
                <label class="form-label">Goal Name</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Master Kinematics" required>
              </div>
              <div class="form-group">
                <label class="form-label">Subject</label>
                <select name="subject" class="form-control">
                  <option>Calculus II</option>
                  <option>Physics 101</option>
                  <option>Computer Science</option>
                  <option>Literature</option>
                </select>
              </div>
              <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                <div>
                  <label class="form-label">Start Date</label>
                  <input type="date" name="startDate" class="form-control">
                </div>
                <div>
                  <label class="form-label">Deadline</label>
                  <input type="date" name="targetDate" class="form-control">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Milestones <span class="text-faint" style="font-weight:400;">(one per line)</span></label>
                <textarea name="milestones" class="form-control" rows="5" placeholder="Read chapter 5&#10;Do 10 practice problems&#10;Take practice quiz"></textarea>
              </div>
              <button type="submit" class="btn btn-outline" style="width: 100%;">Create Goal</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/goals.js"></script>
</body>
</html>
