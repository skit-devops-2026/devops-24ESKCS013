<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create or edit a study note.">
  <title>Note Editor — Student360</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <button class="sidebar-hamburger" aria-label="Open navigation menu" aria-expanded="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Student navigation">
      <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span><span class="text-gold sidebar-brand-text">Student</span><span class="sidebar-brand-text">360</span></span>
        <button class="sidebar-collapse-btn" aria-label="Collapse sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <a href="dashboard.html" class="sidebar-link"><span class="link-label">Dashboard</span></a>
        <a href="study.html"     class="sidebar-link"><span class="link-label">Study Tracker</span></a>
        <a href="subjects.html"  class="sidebar-link"><span class="link-label">Subjects</span></a>
        <a href="notes.html"     class="sidebar-link active"><span class="link-label">Notes</span></a>
        <a href="tasks.html"     class="sidebar-link"><span class="link-label">Tasks</span></a>
        <a href="goals.html"     class="sidebar-link"><span class="link-label">Goals</span></a>
        <a href="calendar.html"  class="sidebar-link"><span class="link-label">Calendar</span></a>
        <a href="progress.html"  class="sidebar-link"><span class="link-label">Progress</span></a>
        <a href="analytics.html" class="sidebar-link"><span class="link-label">Analytics</span></a>
        <a href="reflection.html" class="sidebar-link"><span class="link-label">Self Review</span></a>
        <a href="ai.html"        class="sidebar-link"><span class="link-label">AI Assistant</span></a>
        <a href="resources.html" class="sidebar-link"><span class="link-label">Resources</span></a>
        <a href="announcements.html" class="sidebar-link"><span class="link-label">Announcements</span></a>
      </nav>
      <div class="sidebar-footer">
        <a href="profile.html"  class="sidebar-link"><span class="link-label">Settings / Profile</span></a>
        <a href="../index.html" class="sidebar-link text-faint"><span class="link-label">Logout</span></a>
      </div>
    </aside>

    <main class="main-content" style="max-width: 1000px;">
      <div style="margin-bottom: 1rem;">
        <a href="notes.html" class="text-faint" style="font-size: 0.875rem;">&larr; Back to Notes</a>
      </div>

      <form id="note-editor-form">
        <header class="dashboard-header" style="align-items: center; margin-bottom: 1.5rem;">
          <input type="text" id="editor-title" class="form-control"
            style="font-family: var(--font-serif); font-size: 2rem; border: none; background: transparent; padding: 0; outline: none; flex: 1;"
            placeholder="Note title…" aria-label="Note title">
          <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span id="autosave-indicator" class="autosave-indicator" aria-live="polite">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              Draft saved
            </span>
            <button type="button" id="delete-note-btn" class="btn btn-outline" style="color:var(--red);border-color:var(--red-soft);display:none;">Delete</button>
            <button type="button" id="save-note-btn" class="btn btn-primary">Save Note</button>
          </div>
        </header>

        <!-- Metadata row -->
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; margin-bottom: 2rem;">
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="editor-subject">Subject</label>
            <select id="editor-subject" class="form-control">
              <option>Calculus II</option>
              <option>Physics 101</option>
              <option>Computer Science</option>
              <option>Literature</option>
            </select>
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" for="tag-chip-input">Tags <span class="text-faint" style="font-weight:400;">(type and press Enter)</span></label>
            <div class="tag-chips-area" id="tag-chips-area">
              <!-- JS will inject chips here -->
              <input type="text" id="tag-chip-input" class="tag-chip-input" placeholder="Add tag…">
            </div>
            <!-- Hidden input to store raw tags string -->
            <input type="hidden" id="editor-tags" value="">
          </div>
        </div>

        <!-- Editor area -->
        <div class="dashboard-panel" style="padding: 0; display: flex; flex-direction: column; min-height: 500px;">
          <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; background-color: var(--paper); flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; gap: 1rem; align-items: center;">
              <button type="button" onclick="document.execCommand('bold')"   style="font-weight: bold; cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Bold">B</button>
              <button type="button" onclick="document.execCommand('italic')" style="font-style: italic; cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Italic">I</button>
              <button type="button" onclick="document.execCommand('underline')" style="text-decoration: underline; cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Underline">U</button>
              <span style="color: var(--rule-strong);">|</span>
              <button type="button" onclick="document.execCommand('formatBlock','false','h2')" style="cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Heading 2">H2</button>
              <button type="button" onclick="document.execCommand('formatBlock','false','h3')" style="cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Heading 3">H3</button>
              <span style="color: var(--rule-strong);">|</span>
              <button type="button" onclick="document.execCommand('insertUnorderedList')" style="cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Bullet List">• List</button>
              <button type="button" onclick="document.execCommand('insertOrderedList')"   style="cursor: pointer; background: none; border: none; font-family: var(--font-sans);" aria-label="Numbered List">1. List</button>
            </div>
            <span id="word-count" class="word-count-badge">0 words</span>
          </div>
          <!-- Plain textarea -->
          <textarea id="editor-content" class="form-control"
            style="border: none; flex: 1; padding: 2rem; resize: none; font-size: 1rem; line-height: 1.8; font-family: var(--font-sans);"
            placeholder="Start typing your notes here…" aria-label="Note content"></textarea>
        </div>
      </form>
    </main>
  </div>
  <script src="../js/main.js"></script>
  <script src="../js/notes.js"></script>
</body>
</html>
