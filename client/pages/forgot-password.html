<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CampusConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">C</div>
        <span class="text-2xl font-bold text-white">CampusConnect</span>
      </a>
      <p class="text-slate-400 mt-3">Reset your password</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <div id="alert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

      <!-- Step 1: Enter email -->
      <div id="step1">
        <p class="text-slate-400 text-sm mb-6">Enter your registered email and we'll send you a reset OTP.</p>
        <form id="forgotForm">
          <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all">
            Send Reset OTP
          </button>
        </form>
      </div>

      <!-- Step 2: Enter OTP + new password -->
      <div id="step2" class="hidden">
        <form id="resetForm">
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-2">OTP Code</label>
            <input id="otp" type="text" placeholder="6-digit OTP" maxlength="6" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 text-center text-xl tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">New Password</label>
            <input id="newPassword" type="password" placeholder="Min. 6 characters" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all">
            Reset Password
          </button>
        </form>
      </div>

      <p class="text-center text-slate-400 text-sm mt-6">
        <a href="/pages/login.html" class="text-indigo-400 hover:text-indigo-300">← Back to login</a>
      </p>
    </div>
  </div>

  <script>
    let emailForReset = '';

    function showAlert(msg, type) {
      const el = $('#alert');
      el.removeClass().addClass(`mb-4 p-4 rounded-xl text-sm font-medium ${type === 'error' ? 'bg-red-900/50 border border-red-700 text-red-300' : 'bg-green-900/50 border border-green-700 text-green-300'}`);
      el.text(msg).show();
    }

    $('#forgotForm').on('submit', function(e) {
      e.preventDefault();
      emailForReset = $('#email').val().trim();
      $.ajax({
        url: '/api/auth/forgot-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ email: emailForReset }),
        success: function(res) {
          showAlert(res.message, 'success');
          setTimeout(() => { $('#step1').addClass('hidden'); $('#step2').removeClass('hidden'); $('#alert').hide(); }, 1500);
        },
        error: function(xhr) {
          showAlert(xhr.responseJSON?.message || 'Error sending OTP.', 'error');
        }
      });
    });

    $('#resetForm').on('submit', function(e) {
      e.preventDefault();
      $.ajax({
        url: '/api/auth/reset-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ email: emailForReset, otp: $('#otp').val().trim(), newPassword: $('#newPassword').val() }),
        success: function(res) {
          showAlert('✅ ' + res.message, 'success');
          setTimeout(() => window.location.href = '/pages/login.html', 2000);
        },
        error: function(xhr) {
          showAlert(xhr.responseJSON?.message || 'Reset failed.', 'error');
        }
      });
    });
  </script>
</body>
</html>
