<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CampusConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">C</div>
        <span class="text-2xl font-bold text-white">CampusConnect</span>
      </a>
      <p class="text-slate-400 mt-3">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <div id="alert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

      <form id="loginForm">
        <!-- Email -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-300 mb-2" for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" required
            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <!-- Password -->
        <div class="mb-5">
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-medium text-slate-300" for="password">Password</label>
            <a href="/pages/forgot-password.html" class="text-sm text-indigo-400 hover:text-indigo-300">Forgot password?</a>
          </div>
          <input id="password" type="password" placeholder="••••••••" required
            class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <!-- Submit -->
        <button id="loginBtn" type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all">
          Sign In
        </button>
      </form>

      <p class="text-center text-slate-400 text-sm mt-6">
        Don't have an account?
        <a href="/pages/register.html" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign up</a>
      </p>
    </div>
  </div>

  <script>
    // Helper to show alerts
    function showAlert(msg, type) {
      const el = $('#alert');
      el.removeClass().addClass(`mb-4 p-4 rounded-xl text-sm font-medium ${type === 'error' ? 'bg-red-900/50 border border-red-700 text-red-300' : 'bg-green-900/50 border border-green-700 text-green-300'}`);
      el.text(msg).show();
    }

    $('#loginForm').on('submit', function(e) {
      e.preventDefault();
      const btn = $('#loginBtn');
      btn.prop('disabled', true).text('Signing in...');

      $.ajax({
        url: '/api/auth/login',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          email: $('#email').val().trim(),
          password: $('#password').val()
        }),
        success: function(res) {
          // Store the JWT token in localStorage
          localStorage.setItem('token', res.token);
          localStorage.setItem('user', JSON.stringify(res.user));

          // Redirect based on role
          if (res.user.role === 'admin') {
            window.location.href = '/pages/admin-dashboard.html';
          } else {
            window.location.href = '/pages/student-dashboard.html';
          }
        },
        error: function(xhr) {
          const msg = xhr.responseJSON?.message || 'Login failed. Please try again.';
          showAlert(msg, 'error');
          btn.prop('disabled', false).text('Sign In');
        }
      });
    });
  </script>
</body>
</html>
