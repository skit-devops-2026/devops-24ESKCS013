<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CampusConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-lg">
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">C</div>
        <span class="text-2xl font-bold text-white">CampusConnect</span>
      </a>
      <p class="text-slate-400 mt-3">Create your student account</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <div id="alert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

      <!-- Step 1: Registration Form -->
      <div id="step1">
        <form id="registerForm">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Full Name</label>
              <input id="name" type="text" placeholder="John Doe" required
                class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Email Address</label>
              <input id="email" type="email" placeholder="john@college.edu" required
                class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
            <input id="password" type="password" placeholder="Min. 6 characters" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-300 mb-1.5">College Name</label>
            <input id="college_name" type="text" placeholder="Your College Name" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Branch</label>
              <select id="branch" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Select</option>
                <option>CSE</option><option>ECE</option><option>MECH</option><option>CIVIL</option><option>IT</option><option>AIDS</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Year</label>
              <select id="year" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Select</option>
                <option>1</option><option>2</option><option>3</option><option>4</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1.5">Semester</label>
              <select id="semester" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Select</option>
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
              </select>
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Roll Number</label>
            <input id="roll_no" type="text" placeholder="e.g. 21CS001" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>

          <button id="registerBtn" type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all">
            Create Account & Send OTP
          </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
          Already have an account?
          <a href="/pages/login.html" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign in</a>
        </p>
      </div>

      <!-- Step 2: OTP Verification (hidden initially) -->
      <div id="step2" class="hidden">
        <div class="text-center mb-6">
          <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">📧</div>
          <h3 class="text-xl font-bold text-white">Check your email</h3>
          <p class="text-slate-400 mt-2 text-sm">We sent a 6-digit OTP to <strong id="emailDisplay" class="text-white"></strong></p>
        </div>

        <form id="otpForm">
          <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">Enter OTP</label>
            <input id="otp" type="text" placeholder="000000" maxlength="6" required
              class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all">
            Verify OTP
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let registeredEmail = '';

    function showAlert(msg, type) {
      const el = $('#alert');
      el.removeClass().addClass(`mb-4 p-4 rounded-xl text-sm font-medium ${type === 'error' ? 'bg-red-900/50 border border-red-700 text-red-300' : 'bg-green-900/50 border border-green-700 text-green-300'}`);
      el.text(msg).show();
    }

    // Step 1: Register
    $('#registerForm').on('submit', function(e) {
      e.preventDefault();
      const btn = $('#registerBtn');
      btn.prop('disabled', true).text('Sending OTP...');

      $.ajax({
        url: '/api/auth/register',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          name: $('#name').val().trim(),
          email: $('#email').val().trim(),
          password: $('#password').val(),
          college_name: $('#college_name').val().trim(),
          branch: $('#branch').val(),
          year: parseInt($('#year').val()),
          semester: parseInt($('#semester').val()),
          roll_no: $('#roll_no').val().trim()
        }),
        success: function(res) {
          registeredEmail = $('#email').val().trim();
          showAlert(res.message, 'success');
          // Show the OTP step
          setTimeout(() => {
            $('#step1').addClass('hidden');
            $('#step2').removeClass('hidden');
            $('#emailDisplay').text(registeredEmail);
            $('#alert').hide();
          }, 1000);
        },
        error: function(xhr) {
          showAlert(xhr.responseJSON?.message || 'Registration failed.', 'error');
          btn.prop('disabled', false).text('Create Account & Send OTP');
        }
      });
    });

    // Step 2: Verify OTP
    $('#otpForm').on('submit', function(e) {
      e.preventDefault();
      $.ajax({
        url: '/api/auth/verify-otp',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ email: registeredEmail, otp: $('#otp').val().trim() }),
        success: function(res) {
          showAlert('✅ ' + res.message + ' Redirecting to login...', 'success');
          setTimeout(() => window.location.href = '/pages/login.html', 2000);
        },
        error: function(xhr) {
          showAlert(xhr.responseJSON?.message || 'OTP verification failed.', 'error');
        }
      });
    });
  </script>
</body>
</html>
